name: Deploy gh-pages

on:
  push:
    branches:
      - 'master'
  schedule:
    - cron: '0 8 * * 1'

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.13

    - name: Install Meggie
      run: |
        pip install .[dev]

    - name: Build and deploy
      run: |
        make update_docs
        mkdocs gh-deploy -b gh-pages --force
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
